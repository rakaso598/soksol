name: CI - Secrets Presence Check

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  check-secrets:
    # Do not run this job for forked PRs because repository secrets are not available to forks
    if: ${{ github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check secrets availability (non-blocking)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "=== Secrets Availability Check ==="
          
          # GEMINI_API_KEY 확인 (warning only)
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️  WARNING: GEMINI_API_KEY not set - API features will be limited"
          else
            echo "✅ GEMINI_API_KEY is available"
          fi

          # Android keystore secrets 확인 (warning only)
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "✅ Android keystore secrets detected"
            for var in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              eval val="\$$var"
              if [ -z "$val" ]; then
                echo "⚠️  WARNING: Missing android secret: $var"
              fi
            done
          else
            echo "ℹ️  Android keystore not configured - release builds will be unsigned"
          fi
          
          echo "=== All checks completed (non-blocking) ==="
