version: 2
updates:
  # Main project (Next.js)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    allow:
      - dependency-type: "all"
    # 보안 업데이트만 자동 병합 (패치 버전만)
    automerge: false
    labels:
      - "dependencies"
      - "automerge"
    commit-message:
      prefix: "deps"
      include: "scope"

  # React Native Mobile App
  - package-ecosystem: "npm"
    directory: "/mobile/soksol_mobile/SokSol"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    automerge: false
    labels:
      - "dependencies"
      - "mobile"
    commit-message:
      prefix: "deps(mobile)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    automerge: false
    labels:
      - "github-actions"
    commit-message:
      prefix: "ci"
